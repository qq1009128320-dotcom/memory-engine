[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-engine"
version = "2.2.0"
description = "Enterprise-grade four-layer agent memory system — Memory Tree + Preferences + Error Correction + Knowledge Graph"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Memory Engine Team" }]
license = { text = "MIT" }
keywords = ["mcp", "agent-memory", "faiss", "knowledge-graph", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    # MCP protocol framework (FastMCP 3.x for SSE transport)
    "fastmcp>=3.0.0,<3.1.0",
    # HTTP server (SSE transport)
    "uvicorn>=0.35.0,<0.36.0",
    # Vector search engine (CPU version, 4GB RAM for 500K vectors)
    "faiss-cpu>=1.7.4,<1.8.0",
    # Embedding model (all-MiniLM-L6-v2, 384-dim, ~80MB)
    "sentence-transformers>=3.0.0,<3.1.0",
    # Numerical computation (P3-2: 与 requirements.txt 保持一致)
    "numpy>=1.26.0,<2.0",
    # TTL in-memory cache (no Redis needed)
    "cachetools>=5.3.0,<5.4.0",
    # HuggingFace Hub (model download/cache)
    "huggingface-hub>=0.25.0,<0.26.0",
    # ONNX runtime (embedding inference)
    "onnxruntime>=1.18,<2.0",
    # HTTP client (DeepSeek API + Feishu integration)
    "httpx>=0.28.1,<0.29.0",
    # Environment management (.env file loading)
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15.21",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/qq1009128320-dotcom/memory-engine"
Documentation = "https://github.com/qq1009128320-dotcom/memory-engine#readme"
"Issue Tracker" = "https://github.com/qq1009128320-dotcom/memory-engine/issues"
Changelog = "https://github.com/qq1009128320-dotcom/memory-engine/blob/main/CHANGELOG.md"

[project.scripts]
# P3-1 修复: memory_server 没有 main() 函数，入口是 if __name__ == "__main__"
# 移除无效 entry point，改为文档说明启动方式
# memory-engine = "memory_server:main"  # 已移除，使用: python -m memory_server 或直接运行

[tool.setuptools]
py-modules = ["memory_server", "config", "validators", "log_utils", "observability"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ARG"]  # allow assert in tests, unused args in fixtures

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    'slow: marks tests as slow (deselect with -m "not slow")',
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
