version: "3.8"

services:
  memory-engine:
    build: .
    container_name: memory-engine
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - FAISS_INDEX_PATH=/data/faiss.index
      - LOG_LEVEL=INFO
      - LOG_FILE=/data/memory-engine.log
      - MCP_SERVER_TRANSPORT=streamable-http
    volumes:
      - memory_data:/data
    restart: unless-stopped
    # P2-7: 优化健康检查（避免频繁调用 LLM，增加启动宽限期）
    healthcheck:
      # P3-⑨ 修复: 简化健康检查，不依赖 memory_health（可能触发 LLM 调用）
      test: ["CMD", "python3", "-c", "
import sqlite3, os, sys
db = os.environ.get('MEMORY_DB_PATH', '/data/memory.db')
try:
    conn = sqlite3.connect(db, timeout=5)
    conn.execute('SELECT 1')
    conn.close()
    sys.exit(0)
except Exception:
    sys.exit(1)
"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  memory_data:
