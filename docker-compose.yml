version: "3.8"

services:
  memory-engine:
    build: .
    container_name: memory-engine
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - FAISS_INDEX_PATH=/data/faiss.index
      - LOG_LEVEL=INFO
      - LOG_FILE=/data/memory-engine.log
    volumes:
      - memory_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from memory_server import memory_health; assert memory_health()['status'] == 'healthy'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  memory_data:
